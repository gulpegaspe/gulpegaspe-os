- name: Build ISO
  id: build-iso
  uses: osbuild/bootc-image-builder-action@vX.Y.Z  # Sostituisci con l'ultima versione
  with:
    # Il file di configurazione TOML per il builder (come il tuo config.toml) [citation:3][citation:7]
    config-file: ./config.toml
    # L'immagine container da usare [citation:8]
    image: ghcr.io/gulpegaspe/gulpegaspe-os
    # Il tipo di output che vuoi: anaconda-iso [citation:4][citation:8]
    types: |
      anaconda-iso
    # Il filesystem root per il disco. Fondamentale per Fedora! [citation:1][citation:6]
    rootfs: btrfs
- name: Upload Artifact
  uses: actions/upload-artifact@v4
  with:
    name: iso
    path: ${{ steps.build-iso.outputs.output-directory }}
